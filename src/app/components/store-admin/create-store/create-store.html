<div class="store-editor-page">
  <nav class="editor-breadcrumb" aria-label="Breadcrumb">
    <a routerLink="/store-admin/stores">Store Management</a>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <span>{{ isEditMode ? 'Edit Store' : 'Create Store' }}</span>
  </nav>

  <header class="editor-header">
    <div>
      <h1>{{ isEditMode ? 'Edit Store' : 'Create Store' }}</h1>
    </div>
    <a class="back-button" routerLink="/store-admin/stores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      <span>Back to Stores</span>
    </a>
  </header>

  <form class="editor-panel" [formGroup]="storeForm" (ngSubmit)="saveStore()" novalidate>
    <section class="form-section" aria-labelledby="store-information-heading">
      <div class="section-heading">
        <h2 id="store-information-heading">Store Information</h2>
      </div>

      <div class="information-grid">
        <div class="form-field">
          <label for="store-name">Store Name <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('name')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10h16M5 10l1-6h12l1 6M6 10v10h12V10M9 14h6"></path>
            </svg>
            <input
              id="store-name"
              type="text"
              formControlName="name"
              placeholder="Enter store name"
              autocomplete="organization"
              maxlength="80"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-owner">Owner Name <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('owner')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"></path>
            </svg>
            <input
              id="store-owner"
              type="text"
              formControlName="owner"
              placeholder="Enter owner name"
              autocomplete="name"
              maxlength="100"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-email">Email <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('email')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
            <input
              id="store-email"
              type="email"
              formControlName="email"
              placeholder="Enter email address"
              autocomplete="email"
              maxlength="120"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-phone">Phone <span>*</span></label>
          <div
            class="phone-control"
            [class.invalid]="fieldInvalid('phone') || fieldInvalid('phoneCode')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"
              ></path>
            </svg>
            <span class="phone-code-control">
              <img
                class="country-flag"
                [src]="phoneCountry().flagUrl"
                [alt]="phoneCountry().flagAlt"
              />
              <select formControlName="phoneCode" aria-label="Phone country code">
                @for (country of countries; track country.name) {
                  <option [value]="country.dialCode">{{ country.dialCode }}</option>
                }
              </select>
            </span>
            <input
              id="store-phone"
              type="tel"
              formControlName="phone"
              placeholder="Enter phone number"
              autocomplete="tel-national"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-country">Country <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('country')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
            </svg>
            <select id="store-country" formControlName="country" (change)="onCountryChange()">
              <option value="">Select country</option>
              @for (country of countries; track country.name) {
                <option [value]="country.name">{{ country.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-field">
          <label for="store-state">State / Province <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('state')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 21V7l8-4 8 4v14M8 10h2M14 10h2M8 14h2M14 14h2M10 21v-3h4v3"></path>
            </svg>
            <input
              id="store-state"
              type="text"
              formControlName="state"
              placeholder="Enter state or province"
              autocomplete="address-level1"
              maxlength="80"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-city">City <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('city')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 21V9l5-3v15M9 21V4l6 3v14M15 21v-8l5-2v10M2 21h20"></path>
            </svg>
            <input
              id="store-city"
              type="text"
              formControlName="city"
              placeholder="Enter city"
              autocomplete="address-level2"
              maxlength="80"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-address">Address <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('address')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <input
              id="store-address"
              type="text"
              formControlName="address"
              placeholder="Enter full address"
              autocomplete="street-address"
              maxlength="200"
            />
          </div>
        </div>

        <div class="form-field">
          <label for="store-postal">Postal Code <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('postalCode')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="6" width="18" height="12" rx="2"></rect>
              <path d="m3 8 9 5 9-5"></path>
            </svg>
            <input
              id="store-postal"
              type="text"
              formControlName="postalCode"
              placeholder="Enter postal code"
              autocomplete="postal-code"
              maxlength="12"
            />
          </div>
        </div>

        <div class="form-field description-field">
          <label for="store-description">Description</label>
          <textarea
            id="store-description"
            formControlName="description"
            placeholder="Enter store description"
            rows="3"
            maxlength="500"
            [class.invalid]="fieldInvalid('description')"
          ></textarea>
        </div>
      </div>
    </section>

    <section class="form-section branding-section" aria-labelledby="branding-heading">
      <div class="section-heading">
        <h2 id="branding-heading">Store Branding <span>(Optional)</span></h2>
      </div>

      <div class="branding-grid">
        <div class="media-field">
          <label>Logo</label>
          <div class="media-row">
            <input
              #logoInput
              id="logo-input"
              class="media-file-input"
              type="file"
              accept="image/png,image/jpeg"
              (change)="onMediaSelected($event, 'logo')"
            />
            <label class="upload-zone" for="logo-input">
              @if (logoPreview()) {
                <img [src]="logoPreview()" alt="Store logo preview" />
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 16l-4-4-4 4M12 12v9"></path>
                  <path d="M20.4 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"></path>
                </svg>
                <strong>Upload Logo</strong>
                <span>PNG, JPG up to 2MB</span>
              }
            </label>
            @if (logoPreview()) {
              <button type="button" class="remove-media" (click)="removeMedia('logo', logoInput)">
                Remove logo
              </button>
            }
          </div>
        </div>

        <div class="media-field">
          <label>Banner</label>
          <div class="media-row">
            <input
              #bannerInput
              id="banner-input"
              class="media-file-input"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              (change)="onMediaSelected($event, 'banner')"
            />
            <label class="upload-zone banner-zone" for="banner-input">
              @if (bannerPreview()) {
                <img [src]="bannerPreview()" alt="Store banner preview" />
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 16l-4-4-4 4M12 12v9"></path>
                  <path d="M20.4 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"></path>
                </svg>
                <strong>Upload Banner</strong>
                <span>PNG, JPG up to 5MB</span>
              }
            </label>
            @if (bannerPreview()) {
              <button
                type="button"
                class="remove-media"
                (click)="removeMedia('banner', bannerInput)"
              >
                Remove banner
              </button>
            }
          </div>
        </div>
      </div>
    </section>

    @if (isEditMode) {
      <section class="form-section allocation-section" aria-labelledby="allocation-heading">
        <div class="section-heading">
          <h2 id="allocation-heading">Inventory Allocation</h2>
        </div>
        <div class="allocation-field form-field">
          <label for="inventory-allocation-limit">Inventory Allocation Limit <span>*</span></label>
          <div class="field-control" [class.invalid]="fieldInvalid('inventoryAllocationLimit')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16v13H4zM7 4h10v3M8 11h8M8 15h5"></path>
            </svg>
            <input
              id="inventory-allocation-limit"
              type="number"
              formControlName="inventoryAllocationLimit"
              min="1"
              max="1000000000"
              step="1"
              inputmode="numeric"
              placeholder="Enter allocation limit"
            />
          </div>
        </div>
      </section>
    }

    <section class="form-section status-section" aria-labelledby="status-heading">
      <div class="section-heading">
        <h2 id="status-heading">Status</h2>
      </div>
      <div class="status-field form-field">
        <label for="store-status">Status <span>*</span></label>
        <div class="status-control">
          <span [class]="'status-dot status-dot--' + storeForm.controls.status.value"></span>
          <select id="store-status" formControlName="status">
            <option value="active">Active</option>
            <option value="pending">Draft</option>
            <option value="disabled">Inactive</option>
          </select>
        </div>
      </div>
    </section>

    <footer class="form-actions">
      <a class="cancel-button" routerLink="/store-admin/stores">Cancel</a>
      <button class="submit-button" type="submit" [disabled]="isSaving() || isProcessingMedia()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (isEditMode) {
            <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"></path>
          } @else {
            <path d="M4 5h16v15H4zM8 5V2h8v3M9 11h6M12 8v6"></path>
          }
        </svg>
        <span>{{ isSaving() ? 'Saving...' : isEditMode ? 'Save Store' : 'Create Store' }}</span>
      </button>
    </footer>
  </form>
</div>
